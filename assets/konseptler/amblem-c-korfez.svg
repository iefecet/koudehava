<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="KOÜ'de Hava — Körfez">
  <defs>
    <linearGradient id="cSky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#1C63B4"/>
      <stop offset="55%" stop-color="#5BAAE4"/>
      <stop offset="100%" stop-color="#BFE2F6"/>
    </linearGradient>
    <linearGradient id="cSun" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFE07A"/>
      <stop offset="100%" stop-color="#FF9414"/>
    </linearGradient>
    <linearGradient id="cHill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#13A05C"/>
      <stop offset="100%" stop-color="#0A6B3C"/>
    </linearGradient>
    <linearGradient id="cSea" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#1480B8"/>
      <stop offset="100%" stop-color="#074A74"/>
    </linearGradient>
    <clipPath id="cClip"><rect width="120" height="120" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#cClip)">
    <rect width="120" height="120" fill="url(#cSky)"/>

    <!-- yukselen gunes -->
    <circle cx="60" cy="70" r="28" fill="#FFCC55" opacity="0.22"/>
    <circle cx="60" cy="70" r="19" fill="url(#cSun)"/>

    <!-- karsi kiyinin tepeleri -->
    <path d="M0 78 Q 16 60 32 70 Q 44 77 54 66 Q 66 53 78 66
             Q 90 78 104 68 Q 113 62 120 70 L120 86 L0 86 Z"
          fill="url(#cHill)"/>

    <!-- korfez suyu -->
    <path d="M0 82 Q 30 76 60 82 Q 90 88 120 82 L120 120 L0 120 Z"
          fill="url(#cSea)"/>

    <!-- dalgalar -->
    <g stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="4"
       stroke-linecap="round" fill="none">
      <path d="M20 98 Q 29 93 38 98"/>
      <path d="M54 105 Q 64 100 74 105"/>
      <path d="M86 96 Q 94 92 102 96"/>
    </g>
  </g>
</svg>
