<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="KOÜ'de Hava — Rüzgâr gülü">
  <defs>
    <linearGradient id="bBg" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#17B268"/>
      <stop offset="55%" stop-color="#0C8C4C"/>
      <stop offset="100%" stop-color="#065C32"/>
    </linearGradient>
    <linearGradient id="bNorth" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFE07A"/>
      <stop offset="100%" stop-color="#FF9E1B"/>
    </linearGradient>
    <filter id="bShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2"
                    flood-color="#03351C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="120" height="120" rx="30" fill="url(#bBg)"/>

  <!-- ince dis halka -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="#FFFFFF"
          stroke-opacity="0.26" stroke-width="2.4"/>

  <!-- ara yonler -->
  <g stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="3.6"
     stroke-linecap="round">
    <line x1="37" y1="37" x2="45" y2="45"/>
    <line x1="83" y1="37" x2="75" y2="45"/>
    <line x1="37" y1="83" x2="45" y2="75"/>
    <line x1="83" y1="83" x2="75" y2="75"/>
  </g>

  <g filter="url(#bShadow)">
    <!-- dogu / bati / guney kollari -->
    <path d="M104 60 L66 66.5 L66 53.5 Z" fill="#FFFFFF" fill-opacity="0.92"
          stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="3"
          stroke-linejoin="round"/>
    <path d="M16 60 L54 53.5 L54 66.5 Z" fill="#FFFFFF" fill-opacity="0.92"
          stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="3"
          stroke-linejoin="round"/>
    <path d="M60 104 L53.5 66 L66.5 66 Z" fill="#FFFFFF" fill-opacity="0.92"
          stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="3"
          stroke-linejoin="round"/>
    <!-- kuzey: vurgu rengi -->
    <path d="M60 16 L66.5 54 L53.5 54 Z" fill="url(#bNorth)"
          stroke="url(#bNorth)" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <circle cx="60" cy="60" r="7.5" fill="#FFFFFF"/>
  <circle cx="60" cy="60" r="3.4" fill="#0C8C4C"/>
</svg>
