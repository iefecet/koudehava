name: Günlük hava durumu paylaşımı

on:
  schedule:
    # GitHub'ın cron'u "en iyi çaba" ile çalışır; tam saat ve yarım saat
    # başlarında yoğunluk yüzünden gecikebilir veya hiç tetiklenmeyebilir.
    # Bu yüzden tek dakika yerine biri asıl biri yedek iki zaman var.
    # Aynı güne ikinci gönderi çıkmaz: paylaşım öncesi kontrol ediliyor.
    # 03:23 UTC = 06:23 Türkiye saati (TR yıl boyunca UTC+3)
    - cron: "23 3 * * *"
    # yedek: 04:13 UTC = 07:13 Türkiye saati
    - cron: "13 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece görselleri üret, Instagram'a paylaşma"
        type: boolean
        default: false

concurrency:
  group: koudehava-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Görselleri üret
        run: python src/main.py --dry-run

      - name: Görselleri repoya yaz (public URL için)
        id: push
        run: |
          DATE=$(TZ=Europe/Istanbul date +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "output/$DATE"
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Hava durumu görselleri: $DATE"
            git push
          fi

      - name: Instagram'a paylaş
        if: ${{ inputs.dry_run != true }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/output
        run: python src/main.py --publish-only

      - name: Görselleri artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slaytlar-${{ steps.push.outputs.date }}
          path: output/${{ steps.push.outputs.date }}/
          retention-days: 14
