name: Günlük hava durumu paylaşımı

on:
  schedule:
    # 03:30 UTC = 06:30 Türkiye saati (TR yıl boyunca UTC+3)
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece görselleri üret, Instagram'a paylaşma"
        type: boolean
        default: false

concurrency:
  group: koudehava-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Görselleri üret
        run: python src/main.py --dry-run

      - name: Görselleri repoya yaz (public URL için)
        id: push
        run: |
          DATE=$(TZ=Europe/Istanbul date +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "output/$DATE"
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Hava durumu görselleri: $DATE"
            git push
          fi

      - name: Instagram'a paylaş
        if: ${{ inputs.dry_run != true }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/output
        run: python src/main.py --publish-only

      - name: Görselleri artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slaytlar-${{ steps.push.outputs.date }}
          path: output/${{ steps.push.outputs.date }}/
          retention-days: 14
